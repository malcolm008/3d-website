<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Car Showroom</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
            color: white;
            position: relative;
        }

        /* Video Background */
        #video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.9);
        }

        /* Dark overlay for better text readability */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.7) 0%,
                rgba(0, 0, 0, 0.4) 30%,
                rgba(0, 0, 0, 0.3) 50%,
                rgba(0, 0, 0, 0.4) 70%,
                rgba(0, 0, 0, 0.7) 100%
            );
            z-index: 0;
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        /* Model selector */
        .model-selector {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            z-index: 1000;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .model-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .model-btn.active,
        .model-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* Posters container - hidden by default */
        .posters-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60%;
            height: 60%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            gap: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease;
            pointer-events: none;
        }

        .posters-container.active {
            opacity: 1;
            visibility: visible;
            pointer-events: all;
        }

        .poster {
            width: 30%;
            height: 80%;
            background-size: cover;
            background-position: center;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            opacity: 0.9;
            transition: transform 0.5s ease, opacity 0.5s ease;
            filter: brightness(0.8);
            cursor: pointer;
            transform: translateY(20px);
        }

        .posters-container.active .poster {
            transform: translateY(0);
        }

        .poster:hover {
            opacity: 1;
            transform: translateY(-5px) !important;
            filter: brightness(1);
        }

        .poster.active {
            border: 3px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }

        /* Car info overlay */
        .car-info {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 3;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 300px;
        }

        .car-name {
            font-size: 2.5rem;
            font-weight: 700;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .car-tagline {
            font-size: 1.1rem;
            opacity: 0.8;
            font-weight: 300;
        }

        /* Navigation controls */
        .navigation {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 80%;
            z-index: 3;
        }

        .nav-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .nav-btn i {
            font-size: 1.8rem;
            color: white;
        }

        .ui-controls {
            display: flex;
            gap: 15px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .ui-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .ui-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .ui-btn i {
            font-size: 1.2rem;
        }

        .color-selector {
            display: flex;
            gap: 15px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 10px 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .color-dot {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .color-dot:hover {
            transform: scale(1.2);
        }

        .color-dot.active {
            transform: scale(1.3);
            box-shadow: 0 0 0 3px white;
        }

        /* Video controls */
        .video-controls {
            position: absolute;
            top: 30px;
            right: 30px;
            display: flex;
            gap: 10px;
            z-index: 3;
        }

        .video-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            font-size: 1.2rem;
        }

        .video-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        /* Specs panel */
        .specs-panel {
            position: fixed;
            top: 0;
            right: -400px;
            width: 380px;
            height: 100%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            transition: right 0.5s ease;
            z-index: 10;
            overflow-y: auto;
        }

        .specs-panel.active {
            right: 0;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }

        .specs-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 10px;
        }

        .specs-list {
            list-style: none;
        }

        .specs-list li {
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
        }

        .spec-label {
            font-weight: 600;
        }

        /* Blur effect when posters are active */
        .video-blur {
            transition: filter 0.5s ease;
        }

        .video-blur.active {
            filter: blur(5px) brightness(0.7);
        }

        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Video Background -->
    <video id="video-background" class="video-blur" autoplay loop muted playsinline>
        <!-- Video source will be set dynamically -->
    </video>
    
    <!-- Dark Overlay -->
    <div class="overlay"></div>
    
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loader"></div>
    </div>

    <!-- Model Selector -->
    <div class="model-selector">
        <button class="model-btn active" data-model="porsche">PORSCHE 911</button>
        <button class="model-btn" data-model="rangerover">RANGE ROVER</button>
        <button class="model-btn" data-model="bmw">BMW M4</button>
        <button class="model-btn" data-model="mercedes">MERCEDES-BENZ</button>
    </div>

    <!-- Posters Container -->
    <div class="posters-container" id="posters-container">
        <!-- Dynamic posters will be inserted here -->
    </div>

    <!-- Car Info -->
    <div class="car-info" id="car-info">
        <div class="car-name" id="car-name">PORSCHE 911</div>
        <div class="car-tagline" id="car-tagline">The Ultimate Driving Machine</div>
    </div>

    <!-- Video Controls -->
    <div class="video-controls">
        <button class="video-btn" id="play-btn" title="Play">▶</button>
        <button class="video-btn" id="mute-btn" title="Mute">🔇</button>
        <button class="video-btn" id="fullscreen-btn" title="Fullscreen">⛶</button>
    </div>

    <!-- Navigation -->
    <div class="navigation">
        <div class="nav-btn" id="prev-btn">
            <i>←</i>
        </div>
        
        <div class="ui-controls">
            <button class="ui-btn" id="show-posters-btn">
                <i>📷</i> Show Posters
            </button>
            <button class="ui-btn" id="show-specs-btn">
                <i>📊</i> Specifications
            </button>
            <div class="color-selector">
                <div class="color-dot active" style="background-color: #2c3e50;" data-color="midnight-blue"></div>
                <div class="color-dot" style="background-color: #c0392b;" data-color="crimson-red"></div>
                <div class="color-dot" style="background-color: #f1c40f;" data-color="sunshine-yellow"></div>
                <div class="color-dot" style="background-color: #27ae60;" data-color="emerald-green"></div>
                <div class="color-dot" style="background-color: #7f8c8d;" data-color="silver-gray"></div>
            </div>
        </div>
        
        <div class="nav-btn" id="next-btn">
            <i>→</i>
        </div>
    </div>

    <!-- Specs Panel -->
    <div class="specs-panel" id="specs-panel">
        <div class="close-btn" id="close-specs">
            <i>×</i>
        </div>
        <h2 class="specs-title" id="specs-title">PORSCHE 911 Specifications</h2>
        <ul class="specs-list" id="specs-list">
            <!-- Dynamic specs will be inserted here -->
        </ul>
    </div>

    <script>
        // Model configurations with video paths
        const modelConfigs = {
            porsche: {
                name: "PORSCHE 911",
                tagline: "The Ultimate Driving Machine",
                videoPath: 'Animation/Car_Anim20001-0274.mp4', // Update with your video path
                posters: [
                    'images/porsche/showroom1.jpg',
                    'images/porsche/showroom2.jpg',
                    'images/porsche/showroom3.jpg'
                ],
                specs: {
                    engine: "Flat-6 Twin-Turbo",
                    horsepower: "443 HP",
                    torque: "390 lb-ft",
                    acceleration: "3.5 seconds",
                    topSpeed: "293 km/h",
                    transmission: "8-Speed PDK",
                    driveType: "Rear-Wheel Drive",
                    weight: "1,515 kg",
                    fuelEconomy: "11.2 L/100km",
                    price: "$107,000"
                }
            },
            rangerover: {
                name: "RANGE ROVER",
                tagline: "Luxury Redefined",
                videoPath: 'videos/rangerover_animation.mp4', // Update with your video path
                posters: [
                    'images/rangerover/showroom4.jpg',
                    'images/rangerover/showroom5.jpg',
                    'images/rangerover/showroom6.jpg'
                ],
                specs: {
                    engine: "V8 Supercharged",
                    horsepower: "518 HP",
                    torque: "461 lb-ft",
                    acceleration: "4.5 seconds",
                    topSpeed: "225 km/h",
                    transmission: "8-Speed Automatic",
                    driveType: "All-Wheel Drive",
                    weight: "2,200 kg",
                    fuelEconomy: "14.5 L/100km",
                    price: "$92,000"
                }
            },
            bmw: {
                name: "BMW M4",
                tagline: "Precision Engineering",
                videoPath: 'videos/bmw_animation.mp4', // Update with your video path
                posters: [
                    'images/bmw/showroom7.jpg',
                    'images/bmw/showroom8.jpg',
                    'images/bmw/showroom9.jpg'
                ],
                specs: {
                    engine: "Inline-6 Twin-Turbo",
                    horsepower: "473 HP",
                    torque: "406 lb-ft",
                    acceleration: "3.8 seconds",
                    topSpeed: "250 km/h",
                    transmission: "6-Speed Manual",
                    driveType: "Rear-Wheel Drive",
                    weight: "1,700 kg",
                    fuelEconomy: "10.8 L/100km",
                    price: "$71,800"
                }
            },
            mercedes: {
                name: "MERCEDES-BENZ",
                tagline: "The Best or Nothing",
                videoPath: 'videos/mercedes_animation.mp4', // Update with your video path
                posters: [
                    'images/mercedes/showroom10.jpg',
                    'images/mercedes/showroom11.jpg',
                    'images/mercedes/showroom12.jpg'
                ],
                specs: {
                    engine: "V8 Biturbo",
                    horsepower: "469 HP",
                    torque: "516 lb-ft",
                    acceleration: "4.0 seconds",
                    topSpeed: "250 km/h",
                    transmission: "9-Speed Automatic",
                    driveType: "All-Wheel Drive",
                    weight: "1,995 kg",
                    fuelEconomy: "12.3 L/100km",
                    price: "$76,000"
                }
            }
        };

        // Global variables
        let currentVideo = null;
        let currentModelKey = 'porsche';
        let isMuted = true;
        let isLoading = false;

        // DOM elements
        const videoBackground = document.getElementById('video-background');
        const carNameElement = document.getElementById('car-name');
        const carTaglineElement = document.getElementById('car-tagline');
        const colorDots = document.querySelectorAll('.color-dot');
        const specsPanel = document.getElementById('specs-panel');
        const closeSpecsBtn = document.getElementById('close-specs');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const showPostersBtn = document.getElementById('show-posters-btn');
        const showSpecsBtn = document.getElementById('show-specs-btn');
        const modelButtons = document.querySelectorAll('.model-btn');
        const specsTitle = document.getElementById('specs-title');
        const specsList = document.getElementById('specs-list');
        const postersContainer = document.getElementById('posters-container');
        const loadingOverlay = document.getElementById('loading-overlay');
        const playBtn = document.getElementById('play-btn');
        const muteBtn = document.getElementById('mute-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const videoBlur = document.querySelector('.video-blur');

        // Get model keys for navigation
        const modelKeys = Object.keys(modelConfigs);

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Load initial model
            loadModel('porsche');
            
            // Initialize specs panel
            updateSpecsPanel(modelConfigs.porsche);
            
            // Set up event listeners
            setupEventListeners();
            
            // Preload all videos
            preloadVideos();
        });

        function setupEventListeners() {
            // Model selector buttons
            modelButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    const modelKey = this.dataset.model;
                    loadModel(modelKey);
                    
                    // Update active button
                    modelButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                });
            });

            // Navigation buttons
            prevBtn.addEventListener('click', function() {
                const currentIndex = modelKeys.indexOf(currentModelKey);
                const prevIndex = (currentIndex - 1 + modelKeys.length) % modelKeys.length;
                const prevModelKey = modelKeys[prevIndex];
                loadModel(prevModelKey);
                
                // Update active button
                modelButtons.forEach(b => b.classList.remove('active'));
                document.querySelector(`[data-model="${prevModelKey}"]`).classList.add('active');
            });

            nextBtn.addEventListener('click', function() {
                const currentIndex = modelKeys.indexOf(currentModelKey);
                const nextIndex = (currentIndex + 1) % modelKeys.length;
                const nextModelKey = modelKeys[nextIndex];
                loadModel(nextModelKey);
                
                // Update active button
                modelButtons.forEach(b => b.classList.remove('active'));
                document.querySelector(`[data-model="${nextModelKey}"]`).classList.add('active');
            });

            // Color selection
            colorDots.forEach(dot => {
                dot.addEventListener('click', function() {
                    colorDots.forEach(d => d.classList.remove('active'));
                    this.classList.add('active');
                    // Color change functionality can be added here
                });
            });

            // Close specs panel
            closeSpecsBtn.addEventListener('click', function() {
                specsPanel.classList.remove('active');
            });

            // Show specs button
            showSpecsBtn.addEventListener('click', function() {
                specsPanel.classList.add('active');
            });

            // Show posters button
            showPostersBtn.addEventListener('click', function() {
                postersContainer.classList.toggle('active');
                videoBlur.classList.toggle('active');
                
                // Update button text
                if (postersContainer.classList.contains('active')) {
                    this.innerHTML = '<i>👁️</i> Hide Posters';
                } else {
                    this.innerHTML = '<i>📷</i> Show Posters';
                }
            });

            // Video controls
            playBtn.addEventListener('click', togglePlayPause);
            muteBtn.addEventListener('click', toggleMute);
            fullscreenBtn.addEventListener('click', toggleFullscreen);
        }

        function loadModel(modelKey) {
            if (isLoading) return;
            
            const config = modelConfigs[modelKey];
            if (!config) {
                console.error('Model configuration not found:', modelKey);
                return;
            }

            currentModelKey = modelKey;
            isLoading = true;
            
            // Show loading overlay
            loadingOverlay.style.opacity = '1';
            loadingOverlay.style.pointerEvents = 'all';

            // Update car info
            carNameElement.textContent = config.name;
            carTaglineElement.textContent = config.tagline;

            // Update posters
            updatePosters(config.posters);

            // Update specs panel
            updateSpecsPanel(config);

            // Load video
            videoBackground.src = config.videoPath;
            videoBackground.load();

            // Handle video events
            videoBackground.onloadeddata = function() {
                isLoading = false;
                loadingOverlay.style.opacity = '0';
                loadingOverlay.style.pointerEvents = 'none';
                
                // Play video
                videoBackground.play().catch(e => {
                    console.log('Autoplay prevented:', e);
                });
            };

            videoBackground.onerror = function() {
                console.error('Error loading video:', config.videoPath);
                isLoading = false;
                loadingOverlay.style.opacity = '0';
                loadingOverlay.style.pointerEvents = 'none';
                
                // Show error message
                carTaglineElement.textContent = "Video not available - using default";
                videoBackground.src = 'videos/default_animation.mp4'; // Add a default video
            };

            console.log(`${config.name} video loaded`);
        }

        function updatePosters(posters) {
            const container = document.getElementById('posters-container');
            container.innerHTML = '';
            
            posters.forEach((posterUrl, index) => {
                const poster = document.createElement('div');
                poster.className = 'poster' + (index === 0 ? ' active' : '');
                poster.style.backgroundImage = `url('${posterUrl}')`;
                poster.onclick = () => switchToPosterView(index);
                container.appendChild(poster);
            });
        }

        function switchToPosterView(posterIndex) {
            // Update active poster
            document.querySelectorAll('.poster').forEach((poster, index) => {
                poster.classList.toggle('active', index === posterIndex);
            });
        }

        function updateSpecsPanel(config) {
            specsTitle.textContent = `${config.name} Specifications`;
            specsList.innerHTML = '';
            
            for (const [key, value] of Object.entries(config.specs)) {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span class="spec-label">${formatSpecLabel(key)}:</span>
                    <span class="spec-value">${value}</span>
                `;
                specsList.appendChild(li);
            }
        }

        function formatSpecLabel(label) {
            return label.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase());
        }

        function togglePlayPause() {
            if (videoBackground.paused) {
                videoBackground.play();
                playBtn.innerHTML = '⏸';
                playBtn.title = "Pause";
            } else {
                videoBackground.pause();
                playBtn.innerHTML = '▶';
                playBtn.title = "Play";
            }
        }

        function toggleMute() {
            isMuted = !isMuted;
            videoBackground.muted = isMuted;
            
            if (isMuted) {
                muteBtn.innerHTML = '🔇';
                muteBtn.title = "Unmute";
            } else {
                muteBtn.innerHTML = '🔊';
                muteBtn.title = "Mute";
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
                fullscreenBtn.innerHTML = '⛶';
                fullscreenBtn.title = "Exit Fullscreen";
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    fullscreenBtn.innerHTML = '⛶';
                    fullscreenBtn.title = "Fullscreen";
                }
            }
        }

        function preloadVideos() {
            // Preload all videos for smooth transitions
            Object.values(modelConfigs).forEach(config => {
                const video = document.createElement('video');
                video.src = config.videoPath;
                video.preload = 'auto';
                video.style.display = 'none';
                document.body.appendChild(video);
            });
        }

        // Handle fullscreen change
        document.addEventListener('fullscreenchange', function() {
            if (!document.fullscreenElement) {
                fullscreenBtn.innerHTML = '⛶';
                fullscreenBtn.title = "Fullscreen";
            }
        });

        // Handle ESC key to hide posters
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (postersContainer.classList.contains('active')) {
                    postersContainer.classList.remove('active');
                    videoBlur.classList.remove('active');
                    showPostersBtn.innerHTML = '<i>📷</i> Show Posters';
                }
                if (specsPanel.classList.contains('active')) {
                    specsPanel.classList.remove('active');
                }
            }
        });
    </script>
</body>
</html>
