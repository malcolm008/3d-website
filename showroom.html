<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Car Showroom</title>
    <link rel="stylesheet" href="styles/showroom-nav.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
            color: white;
            position: relative;
            background: #000;
        }

        /* Video Background - More visible on mobile */
        #video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.8);
        }

        /* Reduced overlay opacity for mobile */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.5) 0%,
                rgba(0, 0, 0, 0.2) 30%,
                rgba(0, 0, 0, 0.1) 50%,
                rgba(0, 0, 0, 0.2) 70%,
                rgba(0, 0, 0, 0.5) 100%
            );
            z-index: 0;
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        /* Model selector - Hide by default, show on tap */
        .model-selector {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: none;
            flex-direction: column;
            padding: 15px;
            border-radius: 0 0 15px 15px;
            z-index: 1000;
            transform: translateY(-100%);
            transition: transform 0.3s ease;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }

        .model-selector.active {
            display: flex;
            transform: translateY(0);
        }

        .model-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 12px 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            margin-bottom: 8px;
            text-align: center;
        }

        .model-btn.active,
        .model-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Model selector toggle button */
        .model-toggle {
            position: fixed;
            top: 15px;
            left: 15px;
            width: 45px;
            height: 45px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 1001;
            color: white;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .model-toggle:hover {
            background: rgba(0, 0, 0, 0.8);
            transform: scale(1.1);
        }

        /* Posters container - Simplified for mobile */
        .posters-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease;
            pointer-events: none;
            padding: 20px;
        }

        .posters-container.active {
            opacity: 1;
            visibility: visible;
            pointer-events: all;
        }

        .poster {
            width: 100%;
            height: 30%;
            background-size: cover;
            background-position: center;
            border-radius: 10px;
            margin-bottom: 15px;
            opacity: 0.9;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .poster.active {
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            opacity: 1;
        }

        /* Car info - Minimal, transparent */
        .car-info {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 3;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 20px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: auto;
            max-width: 80%;
        }

        .car-name {
            font-size: 1.3rem;
            font-weight: 600;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5);
            letter-spacing: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Compact navigation - Hidden by default */
        .navigation {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 95%;
            z-index: 3;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .navigation.active {
            opacity: 1;
            visibility: visible;
        }

        /* Main action button - Shows nav on tap */
        .action-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 4;
            color: white;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .action-button:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
        }

        /* Compact UI controls */
        .ui-controls {
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            justify-content: space-between;
        }

        .ui-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            font-size: 0.9rem;
            flex: 1;
            text-align: center;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ui-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .color-selector {
            display: none;
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 10px 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 5;
        }

        .color-selector.active {
            display: flex;
        }

        .color-dot {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .color-dot:hover {
            transform: scale(1.2);
        }

        .color-dot.active {
            transform: scale(1.3);
            box-shadow: 0 0 0 3px white;
        }

        /* Video controls - Minimal */
        .video-controls {
            position: fixed;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
            z-index: 3;
        }

        .video-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            font-size: 1rem;
        }

        .video-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
        }

        /* Specs panel - Mobile optimized */
        .specs-panel {
            position: fixed;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(15px);
            padding: 20px;
            transition: left 0.5s ease;
            z-index: 10;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .specs-panel.active {
            left: 0;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.5rem;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg);
        }

        .specs-title {
            font-size: 1.5rem;
            margin: 40px 0 20px 0;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .specs-list {
            list-style: none;
        }

        .specs-list li {
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
        }

        .spec-label {
            font-weight: 600;
        }

        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Desktop styles */
        @media (min-width: 769px) {
            .overlay {
                background: linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.7) 0%,
                    rgba(0, 0, 0, 0.4) 30%,
                    rgba(0, 0, 0, 0.3) 50%,
                    rgba(0, 0, 0, 0.4) 70%,
                    rgba(0, 0, 0, 0.7) 100%
                );
            }

            .model-selector {
                position: absolute;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                flex-direction: row;
                width: auto;
                background: rgba(0, 0, 0, 0.7);
                transform: translateX(-50%) translateY(0) !important;
                border-radius: 30px;
            }

            .model-toggle {
                display: none;
            }

            .car-info {
                position: absolute;
                bottom: 100px;
                top: auto;
                background: rgba(0, 0, 0, 0.5);
                padding: 20px 40px;
                border-radius: 20px;
            }

            .car-name {
                font-size: 2.5rem;
            }

            .navigation {
                position: absolute;
                bottom: 30px;
                opacity: 1;
                visibility: visible;
            }

            .action-button {
                display: none;
            }

            .ui-controls {
                width: auto;
            }

            .color-selector {
                position: static;
                display: flex;
                transform: none;
            }

            .specs-panel {
                width: 380px;
                left: -400px;
            }

            .specs-panel.active {
                left: 0;
            }

            .posters-container {
                flex-direction: row;
                width: 60%;
                height: 60%;
                background: transparent;
            }

            .poster {
                width: 30%;
                height: 80%;
                margin-bottom: 0;
            }
        }

        /* Tablet styles */
        @media (min-width: 481px) and (max-width: 768px) {
            .car-name {
                font-size: 1.8rem;
            }

            .ui-btn {
                padding: 10px 20px;
                font-size: 1rem;
            }

            .poster {
                height: 40%;
            }

            .specs-panel {
                padding: 30px;
            }
        }

        /* Very small phones */
        @media (max-width: 480px) {
            .ui-btn {
                font-size: 0.85rem;
                padding: 6px 12px;
            }

            .action-button {
                width: 50px;
                height: 50px;
                font-size: 1.3rem;
            }
        }

        /* Touch-friendly hover states */
        @media (hover: hover) {
            .model-btn:hover,
            .ui-btn:hover,
            .video-btn:hover,
            .color-dot:hover,
            .close-btn:hover,
            .action-button:hover {
                transform: scale(1.1);
            }
        }
    </style>
</head>

                        'https://images.unsplash.com/photo-1549399542-7e3f8b79c341?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80',
                        'https://images.unsplash.com/photo-1580273916550-e323be2ae537?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80',
                        'https://images.unsplash.com/photo-1544636331-e26879cd4d9b?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80'
                    ]
                },
                specs: {
                    engine: "V8 Biturbo",
                    horsepower: "469 HP",
                    torque: "516 lb-ft",
                    acceleration: "4.0 seconds",
                    topSpeed: "250 km/h",
                    transmission: "9-Speed Automatic",
                    driveType: "All-Wheel Drive",
                    weight: "1,995 kg",
                    fuelEconomy: "12.3 L/100km",
                    price: "$76,000"
                }
            }
        };

        // Global variables
        let currentVideo = null;
        let currentModelKey = 'porsche';
        let isMuted = true;
        let isLoading = false;
        let currentScreenSize = 'large';
        let isMobile = window.innerWidth < 769;
        let isNavVisible = false;
        let isModelSelectorVisible = false;

        // DOM elements
        const videoBackground = document.getElementById('video-background');
        const carNameElement = document.getElementById('car-name');
        const modelToggle = document.getElementById('model-toggle');
        const modelSelector = document.getElementById('model-selector');
        const actionButton = document.getElementById('action-button');
        const navigation = document.getElementById('navigation');
        const colorSelector = document.getElementById('color-selector');
        const colorDots = document.querySelectorAll('.color-dot');
        const specsPanel = document.getElementById('specs-panel');
        const closeSpecsBtn = document.getElementById('close-specs');
        const showPostersBtn = document.getElementById('show-posters-btn');
        const showSpecsBtn = document.getElementById('show-specs-btn');
        const modelButtons = document.querySelectorAll('.model-btn');
        const specsTitle = document.getElementById('specs-title');
        const specsList = document.getElementById('specs-list');
        const postersContainer = document.getElementById('posters-container');
        const loadingOverlay = document.getElementById('loading-overlay');
        const playBtn = document.getElementById('play-btn');
        const muteBtn = document.getElementById('mute-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');

        // Get model keys for navigation
        const modelKeys = Object.keys(modelConfigs);

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Detect screen size
            detectScreenSize();
            
            // Load initial model
            loadModel('porsche');
            
            // Initialize specs panel
            updateSpecsPanel(modelConfigs.porsche);
            
            // Set up event listeners
            setupEventListeners();
            
            // Hide loading overlay
            setTimeout(() => {
                loadingOverlay.style.opacity = '0';
                setTimeout(() => {
                    loadingOverlay.style.display = 'none';
                }, 500);
            }, 1000);
        });

        function detectScreenSize() {
            const width = window.innerWidth;
            isMobile = width < 769;
            currentScreenSize = width >= 769 ? 'large' : 'small';
            
            // Reset UI states on mobile
            if (isMobile) {
                hideNavigation();
                hideModelSelector();
            } else {
                showNavigation();
                showModelSelector();
            }
            
            return currentScreenSize;
        }

        function setupEventListeners() {
            // Toggle model selector on mobile
            modelToggle.addEventListener('click', function(e) {
                e.stopPropagation();
                if (isModelSelectorVisible) {
                    hideModelSelector();
                } else {
                    showModelSelector();
                    hideNavigation();
                }
            });

            // Toggle navigation on mobile
            actionButton.addEventListener('click', function(e) {
                e.stopPropagation();
                if (isNavVisible) {
                    hideNavigation();
                } else {
                    showNavigation();
                    hideModelSelector();
                }
            });

            // Close model selector when clicking outside (mobile)
            document.addEventListener('click', function(e) {
                if (isMobile && isModelSelectorVisible && 
                    !modelSelector.contains(e.target) && 
                    !modelToggle.contains(e.target)) {
                    hideModelSelector();
                }
                
                if (isMobile && isNavVisible &&
                    !navigation.contains(e.target) &&
                    !actionButton.contains(e.target)) {
                    hideNavigation();
                }
            });

            // Model selector buttons
            modelButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    const modelKey = this.dataset.model;
                    loadModel(modelKey);
                    
                    // Update active button
                    modelButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    
                    // Hide model selector on mobile after selection
                    if (isMobile) {
                        hideModelSelector();
                    }
                });
            });

            // Color selection
            colorDots.forEach(dot => {
                dot.addEventListener('click', function() {
                    colorDots.forEach(d => d.classList.remove('active'));
                    this.classList.add('active');
                    // Color change functionality can be added here
                });
            });

            // Close specs panel
            closeSpecsBtn.addEventListener('click', function() {
                specsPanel.classList.remove('active');
            });

            // Show specs button
            showSpecsBtn.addEventListener('click', function() {
                specsPanel.classList.add('active');
                if (isMobile) hideNavigation();
            });

            // Show posters button
            showPostersBtn.addEventListener('click', function() {
                postersContainer.classList.toggle('active');
                if (isMobile) hideNavigation();
            });

            // Video controls
            playBtn.addEventListener('click', togglePlayPause);
            muteBtn.addEventListener('click', toggleMute);
            fullscreenBtn.addEventListener('click', toggleFullscreen);

            // Window resize
            window.addEventListener('resize', function() {
                detectScreenSize();
            });

            // Tap anywhere on screen to hide UI on mobile (except when interacting with UI)
            document.addEventListener('click', function(e) {
                if (isMobile && !e.target.closest('.model-selector') && 
                    !e.target.closest('.navigation') && 
                    !e.target.closest('.action-button') &&
                    !e.target.closest('.model-toggle') &&
                    !e.target.closest('.specs-panel') &&
                    !e.target.closest('.posters-container') &&
                    !e.target.closest('.video-controls')) {
                    
                    hideNavigation();
                    hideModelSelector();
                }
            });
        }

        function showNavigation() {
            if (isMobile) {
                navigation.classList.add('active');
                isNavVisible = true;
            }
        }

        function hideNavigation() {
            if (isMobile) {
                navigation.classList.remove('active');
                isNavVisible = false;
            }
        }

        function showModelSelector() {
            if (isMobile) {
                modelSelector.classList.add('active');
                isModelSelectorVisible = true;
            }
        }

        function hideModelSelector() {
            if (isMobile) {
                modelSelector.classList.remove('active');
                isModelSelectorVisible = false;
            }
        }

        function loadModel(modelKey, forceReload = false) {
            if (isLoading && !forceReload) return;
            
            const config = modelConfigs[modelKey];
            if (!config) return;

            currentModelKey = modelKey;
            isLoading = true;
            
            // Update car info
            carNameElement.textContent = config.name;
            
            // Get appropriate content for current screen size
            const videoPath = config.videoPath[currentScreenSize];
            const posterUrls = config.posters[currentScreenSize];

            // Update posters
            updatePosters(posterUrls);

            // Update specs panel
            updateSpecsPanel(config);

            // Load video
            videoBackground.src = videoPath;
            
            // Handle video loading
            videoBackground.onloadeddata = function() {
                isLoading = false;
                loadingOverlay.style.opacity = '0';
                setTimeout(() => {
                    loadingOverlay.style.display = 'none';
                }, 500);
                
                // Try to play
                videoBackground.play().then(() => {
                    playBtn.innerHTML = '⏸';
                    playBtn.title = "Pause";
                }).catch(e => {
                    playBtn.innerHTML = '▶';
                    playBtn.title = "Play";
                });
            };

            videoBackground.onerror = function() {
                isLoading = false;
                loadingOverlay.style.opacity = '0';
                setTimeout(() => {
                    loadingOverlay.style.display = 'none';
                }, 500);
                
                videoBackground.play().catch(e => {
                    console.log('Play error:', e.message);
                });
            };

            // Try to play immediately
            videoBackground.play().then(() => {
                playBtn.innerHTML = '⏸';
                playBtn.title = "Pause";
            }).catch(e => {
                // Autoplay prevented
            });
        }

        function updatePosters(posterUrls) {
            const container = document.getElementById('posters-container');
            container.innerHTML = '';
            
            posterUrls.forEach((posterUrl, index) => {
                const poster = document.createElement('div');
                poster.className = 'poster' + (index === 0 ? ' active' : '');
                poster.style.backgroundImage = `url('${posterUrl}')`;
                poster.onclick = () => switchToPosterView(index);
                container.appendChild(poster);
            });
        }

        function switchToPosterView(posterIndex) {
            document.querySelectorAll('.poster').forEach((poster, index) => {
                poster.classList.toggle('active', index === posterIndex);
            });
        }

        function updateSpecsPanel(config) {
            specsTitle.textContent = `${config.name} Specifications`;
            specsList.innerHTML = '';
            
            for (const [key, value] of Object.entries(config.specs)) {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span class="spec-label">${formatSpecLabel(key)}:</span>
                    <span class="spec-value">${value}</span>
                `;
                specsList.appendChild(li);
            }
        }

        function formatSpecLabel(label) {
            return label.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase());
        }

        function togglePlayPause() {
            if (videoBackground.paused) {
                videoBackground.play().then(() => {
                    playBtn.innerHTML = '⏸';
                    playBtn.title = "Pause";
                });
            } else {
                videoBackground.pause();
                playBtn.innerHTML = '▶';
                playBtn.title = "Play";
            }
        }

        function toggleMute() {
            isMuted = !isMuted;
            videoBackground.muted = isMuted;
            
            if (isMuted) {
                muteBtn.innerHTML = '🔇';
                muteBtn.title = "Unmute";
            } else {
                muteBtn.innerHTML = '🔊';
                muteBtn.title = "Mute";
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Fullscreen error: ${err.message}`);
                });
                fullscreenBtn.innerHTML = '⛶';
                fullscreenBtn.title = "Exit Fullscreen";
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    fullscreenBtn.innerHTML = '⛶';
                    fullscreenBtn.title = "Fullscreen";
                }
            }
        }

        // Handle fullscreen change
        document.addEventListener('fullscreenchange', function() {
            if (!document.fullscreenElement) {
                fullscreenBtn.innerHTML = '⛶';
                fullscreenBtn.title = "Fullscreen";
            }
        });

        // Handle ESC key to hide UI
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (postersContainer.classList.contains('active')) {
                    postersContainer.classList.remove('active');
                }
                if (specsPanel.classList.contains('active')) {
                    specsPanel.classList.remove('active');
                }
                if (isMobile) {
                    hideNavigation();
                    hideModelSelector();
                }
            }
        });

        // Handle visibility change
        document.addEventListener('visibilitychange', function() {
            if (document.hidden && !videoBackground.paused) {
                videoBackground.pause();
                playBtn.innerHTML = '▶';
                playBtn.title = "Play";
            }
        });
    </script>
</body>
</html>
